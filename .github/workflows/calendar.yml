name: Econ calendar alerts

"on":
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:        # allows a manual test run from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit .posted.json back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check calendar and alert Discord
        run: python calendar_bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save posted-event state
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          if [ -f .posted.json ]; then
            git add .posted.json
            git diff --cached --quiet || (git commit -m "update posted events" && git push)
          else
            echo "No state file yet (bot skipped - check DISCORD_WEBHOOK_URL secret)."
          fi
